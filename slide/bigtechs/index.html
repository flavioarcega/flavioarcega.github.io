            # SEGURANÇA DIGITAL
alinhamento entre big techs e extrema direita: CEOs da Meta, Alphabet, Amazon, Apple e X presentes na posse de Trump; Meta encerrando checagem de fatos nos EUA; Amazon abandonando políticas de diversidade.
Produção industrial da informação, convergência tecnológica, comércio eletrônico, videoconferência, trabalho à distância, home-office, educação à distância, banco digital, produtos e serviços digitais.  
Múltiplas perdas: qualificação, desemprego, comunicação pessoal e grupal, individualidade, privacidade, poluição, nossa identidade, falta de controle da nossa vida/tempo, adoecimento, aprofundamento das desigualdades devido à dificuldade de acesso à informação e às novas tecnologias. A pandemia escancarou o fosso da desigualdade social por meio da falta de acesso. Lembro de uma vizinha que foi babá das minhas filhas durante a pandemia e que não sabia usar pix.  
Aspectos culturais como a pessoa ter que se vender como alta produtividade, eficiência, autogestão, patrão de si mesma.  
Desafio da educação em absorver essas tecnologias, dar acesso a elas e amplie as potencialidades e a inteligência humanas, sem perder uma visão crítica da sociedade e do impacto que a tecnologia tem sobre nossas vidas. Porque o mais comum é ouvir dizer que a escola está obsoleta, que a escola é do séc. XIX, mas porque isso? Quem é que faz essa crítica e que modelo de educação essas pessoas estão falando?
            --

            Roubo de aparelho
            Roubo de acesso, senhas, contas
            Sistemas vulneráveis, atualização, instalação de aplicativos
            Roubo do banco
            Crianças vulneráveis
